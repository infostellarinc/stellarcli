name: golangci-lint
on:
  push:
    branches:
      - master
    paths-ignore:
      - "README.MD"
      - ".github/workflows/*"
  pull_request:
    paths-ignore:
      - "README.MD"
      - ".github/workflows/*"

permissions:
  contents: read

jobs:
  golangci:
    name: lint
    runs-on: ubuntu-latest
    steps:
      # Checkout the repo
      - uses: actions/checkout@v4
      # Install Go
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
      # Lint the project
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.11.4
          args: --timeout=3m
